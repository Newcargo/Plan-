<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title data-i18n="app.title">Urlaub & Kapazität – Admin</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Login -->
<div id="login-screen" class="login-screen" hidden>
  <div class="login-card">
    <h1 data-i18n="login.title">Anmelden</h1>
    <form id="login-form">
      <div class="field">
        <label for="login-email" data-i18n="login.email">E-Mail</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="login-password" data-i18n="login.password">Passwort</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="login.submit">Anmelden</button>
      <p id="login-error" class="error-text" hidden></p>
    </form>
  </div>
</div>

<!-- Erzwungener Passwortwechsel (nach Admin-Login-Erstellung/-Reset) -->
<div id="force-password-screen" class="login-screen" hidden>
  <div class="login-card">
    <h1 data-i18n="forcePw.title">Neues Passwort festlegen</h1>
    <p style="color:var(--text-muted); font-size:0.85rem; margin:-0.5rem 0 1.25rem;" data-i18n="forcePw.subtitle">Dein Zugang wurde mit einem Startpasswort eingerichtet. Bitte lege jetzt dein eigenes Passwort fest, bevor du fortfährst.</p>
    <form id="force-password-form">
      <div class="field">
        <label data-i18n="forcePw.new">Neues Passwort</label>
        <input type="password" id="force-pw-new" required minlength="8" autocomplete="new-password">
      </div>
      <div class="field">
        <label data-i18n="forcePw.confirm">Neues Passwort bestätigen</label>
        <input type="password" id="force-pw-confirm" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="forcePw.submit">Passwort festlegen</button>
      <p id="force-pw-error" class="error-text" hidden></p>
    </form>
  </div>
</div>

<!-- App shell -->
<div id="app-shell" class="app-shell" hidden>
  <nav class="sidebar">
    <div class="brand" data-i18n="app.title">Urlaub & Kapazität – Admin</div>

    <button class="nav-item" data-route="my-leave"><span data-i18n="nav.myLeave">Mein Urlaub</span></button>
    <button class="nav-item" data-route="approvals" data-requires-any="stufe2_genehmiger,people_pool_manager,admin"><span data-i18n="nav.approvals">Genehmigungen</span></button>
    <button class="nav-item" data-route="dashboard" data-requires="admin"><span data-i18n="nav.dashboard">Übersicht</span></button>
    <button class="nav-item" data-route="teams" data-requires="admin"><span data-i18n="nav.teams">Teams</span></button>
    <button class="nav-item" data-route="employees" data-requires="admin"><span data-i18n="nav.employees">Mitarbeiter</span></button>
    <button class="nav-item" data-route="holidays" data-requires="admin"><span data-i18n="nav.holidays">Feiertage</span></button>
    <button class="nav-item" data-route="blocked" data-requires="admin"><span data-i18n="nav.blocked">Sperrzeiten</span></button>
    <button class="nav-item" data-route="sprints" data-requires="admin"><span data-i18n="nav.sprints">PI & Sprints</span></button>
    <button class="nav-item" data-route="bands" data-requires="admin"><span data-i18n="nav.bands">Konfidenzband</span></button>
    <button class="nav-item" data-route="settings" data-requires="admin"><span data-i18n="nav.settings">Einstellungen</span></button>
    <button class="nav-item" data-route="roles" data-requires="admin"><span data-i18n="nav.roles">Rollen & Zugriff</span></button>
    <button class="nav-item" data-route="changelog"><span data-i18n="nav.changelog">Change-Log</span></button>

    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebar-user"></div>
      <div class="sidebar-version mono" id="sidebar-version"></div>
      <div class="lang-toggle">
        <button class="lang-btn" data-lang="de">DE</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <button class="nav-item" id="logout-btn"><span data-i18n="nav.logout">Abmelden</span></button>
    </div>
  </nav>

  <main class="main" id="main-content">
    <!-- Sektionen werden hier dynamisch gerendert -->
  </main>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
